# Hyprland configuration

# ---------- Monitor ----------
# Use the preferred mode, position each detected display automatically, and use
# its default scale. Replace this with explicit monitor rules if needed.
monitor = , preferred, auto, 1

# ---------- Variables ----------
$mainMod = SUPER
$term = kitty
$launcher = rofi -show drun

$editor_ws = 1
$browser_ws = 2
$term_ws = 3
$files_ws = 4
$media_ws = 5

# ---------- Environment ----------
env = XCURSOR_THEME,hyprland_theme
env = XCURSOR_SIZE,32
env = HYPRCURSOR_THEME,hyprland_theme
env = HYPRCURSOR_SIZE,32

# ---------- Input ----------
input {
    # US QWERTY followed by US Dvorak; Super+Space switches layouts.
    kb_layout = us,us
    kb_variant = dvorak,
    kb_options = grp:win_space_toggle
    repeat_rate = 60
    repeat_delay = 250
}

# ---------- Appearance and layout ----------
general {
    layout = master
    gaps_in = 2
    gaps_out = 4
    border_size = 2
    col.active_border = rgba(6699ccff) rgba(3366aaff) 45deg
    col.inactive_border = rgba(333333aa)
}

decoration {
    rounding = 10

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

master {
    mfact = 0.50
    new_status = slave
    orientation = center
}

cursor {
    hide_on_key_press = false
    warp_back_after_non_mouse_input = true
    inactive_timeout = 0
    no_hardware_cursors = true
    use_cpu_buffer = true
}

misc {
    vrr = 1
    focus_on_activate = true
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    allow_session_lock_restore = true
}

# ---------- Window rules ----------
windowrule {
    name = code-workspace
    match:class = ^(code|Code|vscode)$
    workspace = $editor_ws
}

windowrule {
    name = browser-workspace
    match:class = ^(firefox|google-chrome|chrome)$
    workspace = $browser_ws
}

windowrule {
    name = terminal-workspace
    match:class = ^kitty$
    workspace = $term_ws
}

windowrule {
    name = files-workspace
    match:class = ^(thunar|xpad)$
    workspace = $files_ws
}

windowrule {
    name = media-workspace
    match:class = ^vlc$
    workspace = $media_ws
}

# ---------- Application and session startup ----------
exec-once = waybar
exec-once = hyprpaper
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet
exec-once = blueman-applet
exec-once = hypridle
exec-once = gsettings set org.gnome.desktop.interface cursor-size 32
exec-once = hyprctl setcursor hyprland_theme 32

# ---------- Core bindings ----------
bind = $mainMod, Return, exec, $term
bind = $mainMod SHIFT, Return, exec, $term -e btop
bind = $mainMod, C, killactive
bind = $mainMod SHIFT, M, exit
bind = $mainMod, R, exec, $launcher

# Workspaces (Dvorak home-row-oriented keys)
bind = $mainMod, A, workspace, 1
bind = $mainMod, O, workspace, 2
bind = $mainMod, E, workspace, 3
bind = $mainMod, U, workspace, 4
bind = $mainMod, I, workspace, 5

bind = $mainMod SHIFT, A, movetoworkspace, 1
bind = $mainMod SHIFT, O, movetoworkspace, 2
bind = $mainMod SHIFT, E, movetoworkspace, 3
bind = $mainMod SHIFT, U, movetoworkspace, 4
bind = $mainMod SHIFT, I, movetoworkspace, 5

# Master layout controls
bind = $mainMod, M, layoutmsg, swapwithmaster
bind = $mainMod, J, layoutmsg, cyclenext
bind = $mainMod, K, layoutmsg, cycleprev

# Focus and window movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod ALT, left, swapwindow, l
bind = $mainMod ALT, right, swapwindow, r

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0
bind = $mainMod CTRL, K, resizeactive, 0 -50
bind = $mainMod CTRL, J, resizeactive, 0 50

# Window states
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod SHIFT, P, pseudo

# Utilities
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, W, exec, makoctl dismiss
bind = $mainMod CTRL, E, exec, thunar
bind = $mainMod, P, exec, pavucontrol

# Special workspaces
bind = $mainMod, S, togglespecialworkspace, notes
bind = $mainMod SHIFT, R, togglespecialworkspace, read

# Screenshots: each command stores and copies the same timestamped file.
bind = , Print, exec, sh -c 'dir="$HOME/Pictures/screenshots"; mkdir -p "$dir"; file="$dir/full-$(date +%Y%m%d-%H%M%S).png"; grim "$file" && wl-copy < "$file"'
bind = $mainMod, Print, exec, sh -c 'dir="$HOME/Pictures/screenshots"; mkdir -p "$dir"; file="$dir/area-$(date +%Y%m%d-%H%M%S).png"; grim -g "$(slurp)" "$file" && wl-copy < "$file"'
bind = $mainMod SHIFT, Print, exec, grim -g "$(slurp)" /tmp/swappy-edit.png && swappy -f /tmp/swappy-edit.png

# Power management
bind = $mainMod SHIFT, D, exec, brightnessctl -s set 5%
bind = $mainMod SHIFT, B, exec, brightnessctl -s set 50%
bind = $mainMod SHIFT, S, exec, systemctl suspend
bind = $mainMod SHIFT, L, exec, hyprlock

# Media keys
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop
