allow_empty_password = true # Allow empty password or not when authenticating
animation = matrix # The active animation(martrix or doom)
animation_frame_delay = 5 # Delay between each animation frame in milliseconds
animation_timeout_sec = 0 # Stop the animation after some time
asterisk = 0x2022 # The character used to mask the password
auth_fails = 10 # The number of failed authentications before a special animation is played... ;)
auto_login_service = ly-autologin # PAM service name to use for automatic login
auto_login_session = null # Session name to launch automatically
auto_login_user = null # Username to automatically log in
battery_id = null # Identifier for battery whose charge to display at top left
bg = 0x00000000 # Background color id
bigclock = en  # Change the state and language of the big clock
bigclock_12hr = false # Set bigclock to 12-hour notation.
bigclock_seconds = true # Set bigclock to show the seconds.
blank_box = true # Blank main box background
border_fg = 0x0000FFFF # Border foreground color id
box_position_h = 0.5 # Relative horizontal position from the end of the screen
box_position_v = 0.5 # Relative vertical position from the bottom of the screen
box_title = null # Title to show at the top of the main box
brightness_down_cmd = /usr/bin/brightnessctl -q -n s 10%- # Brightness decrease command
brightness_down_key = F5 # Brightness decrease key combination
brightness_up_cmd = /usr/bin/brightnessctl -q -n s +10% # Brightness increase command
brightness_up_key = F6 # Brightness increase key combination
clear_password = true # Erase password input on failure
clock = null # Format string for clock in top right corner (see strftime specification). Example: %c
cmatrix_fg = 0x0000FF00 # CMatrix animation foreground color id
cmatrix_head_col = 0x01FFFFFF # CMatrix animation character string head color id
cmatrix_min_codepoint = 0x21 # CMatrix animation minimum codepoint. It uses a 16-bit integer
cmatrix_max_codepoint = 0x7B # CMatrix animation maximum codepoint. It uses a 16-bit integer
colormix_col1 = 0x00FF0000 # Color mixing animation first color id
colormix_col2 = 0x000000FF # Color mixing animation second color id
colormix_col3 = 0x20000000 # Color mixing animation third color id
corner_bottom_left = null # Bottom left
corner_bottom_right = labels, battery # Bottom right
corner_top_left = null # Top left
corner_top_right = clock numlock,capslock # Top right
custom_bind_width = null # For custom binds: the horizontal limit in characters for each line of custom binds before moving on to the next.
custom_sessions = /etc/ly/custom-sessions # Custom sessions directory
default_input = login # Input box active by default on startup
doom_fire_height = 6 # DOOM animation fire height (1 thru 9)
doom_fire_spread = 2 # DOOM animation fire spread (0 thru 4)
doom_top_color = 0x009F2707 # DOOM animation custom top color (low intensity flames)
doom_middle_color = 0x00C78F17 # DOOM animation custom middle color (medium intensity flames)
doom_bottom_color = 0x00FFFFFF # DOOM animation custom bottom color (high intensity flames)
dur_file_path = /etc/ly/example.dur # Dur file path
dur_offset_alignment = center # Dur file alignment
dur_x_offset = 0 # Dur offset x direction (value is added to the current position determined by alignment, negatives are supported)
dur_y_offset = 0 # Dur offset y direction (value is added to the current position determined by alignment, negatives are supported)
edge_margin = 0 # Set margin to the edges of the DM (useful for curved monitors)
error_bg = 0x00000000 # Error background color id
error_fg = 0x01FF0000 # Error foreground color id
fg = 0x00E0FFFF # Foreground color id
full_color = true # Render true colors (if supported)
gameoflife_entropy_interval = 10 # Game of Life entropy interval (0 = disabled, >0 = add entropy every N generations)
gameoflife_fg = 0x0000FF00 # Game of Life animation foreground color id
gameoflife_frame_delay = 6 # Game of Life frame delay (lower = faster animation, higher = slower)
gameoflife_initial_density = 0.4 # Game of Life initial cell density (0.0 to 1.0)
hide_borders = false # Remove main box borders
inactivity_cmd = /usr/bin/systemctl suspend # Command executed when no input is detected for a certain time
inactivity_delay = 500 # Executes a command after a certain amount of seconds
initial_info_text = null # Initial text to show on the info line
input_len = 34 # Input boxes length
lang = en # Active language
login_cmd = null # Command executed when logging in
login_defs_path = /etc/login.defs # Path for login.defs file (used for listing all local users on the system on Linux)
logout_cmd = null # Command executed when logging out
lua_animation_file = /etc/ly/example.lua # The file pointing to the Lua file to be used when using the Lua animation option
ly_log = /var/log/ly.log # General log file path
margin_box_h = 2 # Main box horizontal margin
margin_box_v = 1 # Main box vertical margin
numlock = false # Set numlock on/off at startup
path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin # Default path
restart_key = F2 # Specifies the key combination used for restart
save_file_dir = /etc/ly # Absolute directory for the save file
service_name = ly # Service name (set to ly to use the provided pam config file)
session_log = .local/state/ly-session.log # Session log file path
setup_cmd = /etc/ly/setup.sh # Setup command
shell = true # Show the shell session in the session list
show_password_key = F7 # Specifies the key combination used for showing the password
shutdown_key = F1 # Specifies the key combination used for shutdown
start_cmd = /etc/ly/startup.sh # Command executed when starting Ly (before the TTY is taken control of)
text_in_center = false # Center the session name.
type_username = true # If true, user will need to manually type username instead of selecting from the list of discovered users
vi_default_mode = normal # Default vi mode
vi_mode = false # Enable vi keybindings
waylandsessions = /usr/share/wayland-sessions # Wayland desktop environments
x_cmd = /usr/bin/X # Xorg server command
x_vt = null # Xorg virtual terminal number
xauth_cmd = /usr/bin/xauth # Xorg xauthority edition tool
xinitrc = ~/.xinitrc # xinitrc
xsessions = /usr/share/xsessions # Xorg desktop environments
